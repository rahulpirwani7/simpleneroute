<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SimpleNetRoute</title>
<style>
:root{--bg:#eef1f4;--panel:#fff;--ink:#1b2733;--mute:#5b6b7a;--line:#d5dbe1;--s1:#2f6fde;--s2:#d98a1e;--s3:#1e9e8a}
@media(prefers-color-scheme:dark){:root{--bg:#161c22;--panel:#1f272f;--ink:#e6ebf0;--mute:#93a1ae;--line:#33404c;--s1:#5b95f5;--s2:#f0a640;--s3:#3cc2ad}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,"Segoe UI",sans-serif}
main{max-width:1000px;margin:0 auto;padding:24px 16px 48px}
h1{font-size:1.7rem;margin:0}h2{font-size:1rem;margin:0 0 10px}
#st{color:var(--mute);margin:2px 0 20px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:16px;margin-bottom:16px}
.topo{display:flex;align-items:center;overflow-x:auto;padding-bottom:28px}
.node{border:2px solid var(--ink);border-radius:6px;padding:8px 12px;text-align:center;min-width:92px;font-weight:600}
.node small{display:block;font-weight:400;color:var(--mute)}
.cable{flex:1;min-width:84px;border-top:7px solid;position:relative}
.cable span{position:absolute;top:8px;left:0;right:0;text-align:center;font-size:.8rem;color:var(--mute);white-space:nowrap}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
.row:last-child{margin-bottom:0}.row b{min-width:110px}
button{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--ink);border-radius:4px;padding:5px 12px;cursor:pointer}
button:hover{background:var(--bg)}button:focus-visible,input:focus-visible{outline:3px solid var(--s1);outline-offset:2px}
input{font:inherit;width:64px;padding:5px;border:1px solid var(--line);border-radius:4px;background:var(--panel);color:var(--ink)}
pre{margin:0;padding:10px;background:var(--bg);border-radius:4px;font:12.5px/1.45 ui-monospace,Consolas,monospace;white-space:pre-wrap;overflow-x:auto;min-height:3em}
#out{min-height:5em}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
.grid .panel{margin:0}.grid pre+pre{margin-top:8px}
</style></head><body><main>
<h1>SimpleNetRoute</h1>
<p id="st">Connecting…</p>
<section class="panel"><div class="topo" aria-label="Topology">
 <div class="node">Client<small>10.10.1.2</small></div>
 <div class="cable" style="border-color:var(--s1)"><span>10.10.1.0/24</span></div>
 <div class="node">Router 1<small>:5000</small></div>
 <div class="cable" style="border-color:var(--s2)"><span>10.10.2.0/24</span></div>
 <div class="node">Router 2<small>:5000</small></div>
 <div class="cable" style="border-color:var(--s3)"><span>10.10.3.0/24</span></div>
 <div class="node">Server<small>10.10.3.2</small></div>
</div></section>
<section class="panel">
 <div class="row"><b>Lab</b>
  <button data-a="setup">Create topology</button><button data-a="start">Start routers and server</button>
  <button data-a="stop">Stop</button><button data-a="teardown">Remove topology</button></div>
 <div class="row"><b>Link condition</b>
  <button data-a="netem" data-c="baseline">Baseline</button><button data-a="netem" data-c="moderate">Moderate</button><button data-a="netem" data-c="higher">Higher</button></div>
 <div class="row"><b>TTL tests</b>
  <button data-a="send" data-ttl="3">Deliver (TTL 3)</button><button data-a="send" data-ttl="1">Expire at Router 1 (TTL 1)</button><button data-a="send" data-ttl="2">Expire at Router 2 (TTL 2)</button></div>
 <div class="row"><b>Delay probe</b>
  <label>TTL <input id="ttl" type="number" min="1" value="8"></label>
  <label>Requests <input id="cnt" type="number" min="1" max="50" value="20"></label>
  <button data-a="send">Send</button><button data-a="ping">Ping</button><button data-a="traceroute">Traceroute</button></div>
 <pre id="out" aria-live="polite">Create the topology, then start the routers.</pre>
</section>
<section class="grid" id="nodes"></section>
</main>
<script>
const $=id=>document.getElementById(id);
const NODES=[["client","Client"],["r1","Router 1"],["r2","Router 2"],["server","Server"]];
$("nodes").innerHTML=NODES.map(([k,t])=>`<div class="panel"><h2>${t}</h2><pre id="rt-${k}"></pre>${k=="client"?"":`<pre id="lg-${k}"></pre>`}</div>`).join("");
async function act(name,q){
  $("out").textContent="Running "+name+"…";
  try{const r=await fetch("/api/"+name+"?"+new URLSearchParams(q),{method:"POST"});$("out").textContent=(await r.json()).out}
  catch(e){$("out").textContent="Could not reach webapp.py. Is it running with sudo?"}
  poll();
}
async function poll(){
  try{const s=await(await fetch("/api/state")).json();
    $("st").textContent=(s.topo?"Topology up":"Topology down")+", "+(s.running?"routers running":"routers stopped");
    for(const n in s.routes)$("rt-"+n).textContent=s.routes[n];
    for(const n in s.logs)$("lg-"+n).textContent=s.logs[n]||"No log entries yet";
  }catch(e){$("st").textContent="Web app offline"}
}
document.addEventListener("click",e=>{
  const b=e.target.closest("button[data-a]");if(!b)return;
  const q={};if(b.dataset.ttl)q.ttl=b.dataset.ttl;if(b.dataset.c)q.c=b.dataset.c;
  if(b.dataset.a=="send"&&!q.ttl){q.ttl=$("ttl").value;q.count=$("cnt").value}
  act(b.dataset.a,q);
});
poll();setInterval(poll,2000);
</script></body></html>
